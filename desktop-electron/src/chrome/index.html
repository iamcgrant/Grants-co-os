<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grant &amp; Co OS</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Desks">
        <div class="brand">
          <img id="wordmark" alt="Grant &amp; Co OS" hidden />
          <p class="product-name">Grant &amp; Co OS</p>
        </div>
        <nav id="desk-nav" class="desk-nav"></nav>
      </aside>
      <div class="main">
        <header class="header">
          <button type="button" id="btn-back" aria-label="Back" hidden>Back</button>
          <button type="button" id="btn-reload" aria-label="Refresh" disabled>Refresh</button>
          <button type="button" id="btn-identity" class="identity" disabled>
            <span id="identity-label">Grant &amp; Co OS</span>
          </button>
          <div id="tab-strip" class="tabs" role="tablist" aria-label="Open desks"></div>
          <button type="button" id="btn-menu" aria-label="More" aria-haspopup="true">•••</button>
        </header>
        <div id="identity-pop" class="popover" hidden>
          <p id="identity-title"></p>
          <p id="identity-host"></p>
        </div>
        <div id="overflow-menu" class="menu" hidden>
          <button type="button" id="menu-clear">Clear site data and sign out</button>
          <button type="button" id="menu-about">About Grant &amp; Co OS</button>
        </div>
        <div id="notice" class="notice" hidden>
          <p id="notice-text"></p>
          <div class="notice-actions">
            <button type="button" id="btn-open-browser" hidden>Open securely in browser</button>
            <button type="button" id="notice-dismiss">Dismiss</button>
          </div>
        </div>
        <div id="surface" class="viewport-well">
          <img id="surface-wordmark" alt="" hidden />
          <p id="surface-title">Grant &amp; Co OS</p>
          <p id="surface-copy">Opening your workspace.</p>
        </div>
      </div>
    </div>
    <script src="./chrome.js"></script>
  </body>
</html>
