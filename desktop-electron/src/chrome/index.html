<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grant &amp; Co OS</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Desks">
        <div class="brand">
          <img class="brand-mark" src="./icons/os.svg" alt="" />
          <div class="brand-copy">
            <p class="eyebrow">Grant &amp; Co Consultants</p>
            <h1>Grant &amp; Co OS</h1>
          </div>
        </div>
        <p class="sidebar-section">Desks</p>
        <nav id="desk-nav" class="desk-nav"></nav>
      </aside>
      <div class="main">
        <header class="header" id="os-header">
          <div class="header-nav">
            <button type="button" id="btn-back" class="icon-btn" hidden aria-label="Back">
              <img src="./icons/back.svg" alt="" />
            </button>
            <button type="button" id="btn-reload" class="icon-btn" hidden aria-label="Refresh">
              <img src="./icons/refresh.svg" alt="" />
            </button>
          </div>
          <div class="vendor-wrap">
            <button type="button" id="vendor-chip" class="vendor-chip" hidden aria-haspopup="dialog" aria-expanded="false">
              <img id="vendor-icon" alt="" />
              <span id="vendor-name"></span>
            </button>
            <div id="vendor-popover" class="popover" hidden role="dialog" aria-label="Desk details">
              <p id="popover-secure" class="popover-secure">
                <img src="./icons/lock.svg" alt="" />
                <span id="popover-lock">HTTPS</span>
              </p>
              <p class="popover-label">Secure hostname</p>
              <p id="popover-host" class="popover-value"></p>
              <p class="popover-label">Official start host</p>
              <p id="popover-official" class="popover-value"></p>
            </div>
          </div>
          <div class="tabs" id="tab-strip" role="tablist" aria-label="Open desks"></div>
          <div class="header-more">
            <button type="button" id="btn-more" class="icon-btn" hidden aria-label="Desk menu" aria-haspopup="menu" aria-expanded="false">
              <img src="./icons/more.svg" alt="" />
            </button>
            <div id="overflow-menu" class="menu" hidden role="menu">
              <button type="button" id="menu-open-browser" role="menuitem">Open in browser</button>
              <button type="button" id="menu-clear" role="menuitem">Clear site data and sign out</button>
              <button type="button" id="menu-forward" role="menuitem" hidden>Forward</button>
            </div>
          </div>
        </header>
        <div id="notice" class="notice" hidden>
          <div class="notice-body">
            <p id="notice-text"></p>
            <button type="button" id="notice-open-browser" class="notice-open" hidden>
              Open securely in browser
            </button>
          </div>
          <button type="button" id="notice-dismiss">Dismiss</button>
        </div>
        <div class="viewport-well">
          <p>Open a desk from the sidebar. Official sites load here.</p>
        </div>
      </div>
    </div>
    <script src="./chrome.js"></script>
  </body>
</html>
