<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grant &amp; Co OS</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Grant &amp; Co OS">
        <p class="eyebrow">Grant &amp; Co</p>
        <h1>OS</h1>
        <nav id="desk-nav" class="desk-nav"></nav>
        <p id="build-id" class="build-id">Build 0822-1754</p>
      </aside>
      <div class="main">
        <div class="tabs" id="tab-strip" role="tablist" aria-label="Open tabs"></div>
        <div id="notice" class="notice" hidden>
          <p id="notice-text"></p>
          <div class="notice-actions">
            <button type="button" id="notice-open-browser" hidden>Open securely in browser</button>
            <button type="button" id="notice-dismiss">Dismiss</button>
          </div>
        </div>
        <div class="viewport-well">
          <p>Select a workspace from the sidebar.</p>
        </div>
      </div>
    </div>
    <script src="./chrome.js"></script>
  </body>
</html>
