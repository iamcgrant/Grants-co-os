[package]
name = "grants-co-os-desktop"
version = "0.1.0"
description = "Grants & Co OS desktop wrapper"
authors = ["Grants & Co Consultants"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "grants_co_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
