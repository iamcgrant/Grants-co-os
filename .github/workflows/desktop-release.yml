# Grants & Co OS desktop release — macOS, Windows, and Linux via Tauri 2.
# Triggers: push tag desktop-v* (e.g. desktop-v0.1.0) or manual workflow_dispatch.
#
# Optional signing secrets (builds succeed unsigned when omitted):
#   macOS  — APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows — WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
# Linux AppImage/deb require no signing secrets.

name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Prepare desktop shell
        run: node scripts/prepare-desktop-shell.mjs
        env:
          GC_DESKTOP_URL: https://os.grantsandco.com

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Apple signing — omit to produce unsigned macOS artifacts
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Optional Windows signing — omit to produce unsigned Windows installers
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          tagName: desktop-v__VERSION__
          releaseName: "Grants & Co OS desktop v__VERSION__"
          releaseBody: |
            Desktop release for Grants & Co OS.

            Unsigned builds are produced when platform signing secrets are not configured.
            Linux AppImage and Debian packages are buildable without code-signing.

            Configure `GC_DESKTOP_MAC_URL`, `GC_DESKTOP_WIN_URL`, and `GC_DESKTOP_LINUX_URL`
            in the web app environment to expose download buttons on `/downloads`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
