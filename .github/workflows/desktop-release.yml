# Grants & Co OS desktop release — unsigned Mac / Windows / Linux first.
# Signing secrets are intentionally NOT injected (empty Apple certs break macOS bundling).
# Add a signed workflow later once APPLE_* / WINDOWS_* secrets are real non-empty values.

name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: mac-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: mac-x64
          - platform: ubuntu-22.04
            target: ""
            bundles: appimage,deb
            artifact: linux
          - platform: windows-latest
            target: ""
            bundles: nsis,msi
            artifact: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop npm deps
        working-directory: desktop
        run: npm ci

      - name: Prepare shell + platform icons
        env:
          GC_DESKTOP_URL: https://os.grantsandco.com
        run: |
          node scripts/prepare-desktop-shell.mjs
          cd desktop && npx tauri icon src-tauri/icons/icon.png

      - name: Build unsigned bundles
        working-directory: desktop
        # No APPLE_* / WINDOWS_* env — unsigned first release.
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            npm run tauri -- build --bundles ${{ matrix.bundles }}
          fi
        shell: bash

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grants-co-os-${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f | sort

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Grants & Co OS desktop ${{ github.ref_name }} (unsigned)
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Grants & Co OS desktop ${{ github.ref_name }}

            Native shell around production: https://os.grantsandco.com

            **Unsigned first release** — macOS Gatekeeper / Windows SmartScreen may warn until signing certificates are configured.

            Server secrets are never bundled in these installers.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.exe
            release-assets/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
